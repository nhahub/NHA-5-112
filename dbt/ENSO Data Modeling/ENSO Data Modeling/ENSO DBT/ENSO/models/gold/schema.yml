version: 2

models:
  - name: dim_intensity
    columns:
      - name: intensity_id
        data_tests:
          - unique
          - not_null
  - name: dim_enso_phase
    columns:
      - name: phase_id
        data_tests:
          - unique
          - not_null
      - name: phase_code
        data_tests:
          - unique
          - not_null
  - name: dim_area
    columns:
      - name: area_code
        data_tests:
          - unique
          - not_null
  - name: dim_flag
    columns:
      - name: flag_code
        data_tests:
          - unique
          - not_null
  - name: dim_element
    columns:
      - name: element_code
        data_tests:
          - unique
          - not_null
  - name: dim_food_index
    columns:
      - name: food_index_id
        data_tests:
          - unique
          - not_null
      - name: index_code
        data_tests:
          - unique
          - not_null
  - name: dim_item
    columns:
      - name: item_code
        data_tests:
          - unique
          - not_null
      - name: food_index_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_food_index'), field: food_index_id}}
  - name: dim_location
    columns:
      - name: location_id
        data_tests:
          - unique
          - not_null
      - name: area_code
        data_tests:
          - relationships: {arguments: {to: ref('dim_area'), field: area_code}}
  - name: dim_nino_region
    columns:
      - name: region_id
        data_tests:
          - unique
          - not_null
      - name: region_code
        data_tests:
          - unique
          - not_null
  - name: dim_year
    columns:
      - name: year_num
        data_tests:
          - unique
          - not_null
  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null
      - name: year_num
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_year'), field: year_num}}
  - name: dim_enso_event
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: phase_id
        data_tests:
          - not_null
